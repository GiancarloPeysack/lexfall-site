<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your offer · Lexfall</title>
<link rel="icon" href="/email/icon.png">
<style>
@font-face{font-family:Newsreader;font-weight:500;src:url(/fonts/newsreader-500.woff2) format('woff2')}
*{box-sizing:border-box}
body{margin:0;background:#F4F0E8;color:#211D16;font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{width:100%;max-width:440px;margin:24px 16px;background:#FBF8F1;border-radius:24px;padding:36px 28px;text-align:center}
img{width:56px;height:56px;border-radius:14px}
.eyebrow{margin:20px 0 0;font-size:12px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:#6E665A}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:32px;line-height:1.2;margin:8px 0 10px}
p{color:#6E665A;margin:0}
.btn{display:block;margin-top:26px;background:#9A7B2E;color:#FBF8F1;border-radius:14px;padding:15px 20px;font-weight:600;text-decoration:none}
.small{margin-top:18px;font-size:14px}
.small a{color:#211D16}
</style>
</head>
<body>
<main>
  <img src="/email/icon.png" alt="Lexfall">
  <p class="eyebrow">An offer for you</p>
  <h1>30% off Yearly</h1>
  <p id="msg">Opening Lexfall, where your offer is waiting.</p>
  <a class="btn" id="open" href="vorto://paywall?offer=exit">Open Lexfall</a>
  <p class="small">Don't have the app on this phone? Get it on the <a id="ios" href="/get/winback-offer">App Store</a> or <a id="play" href="/google-play">Google Play</a>, then open this email again.</p>
</main>
<script src="/offer.js"></script>
</body>
</html>
